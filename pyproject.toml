[project]
name = "tokquay"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.2",
    "torch>=2.6.0",
    "transformers>=5.17.0",
    "uvicorn[standard]>=0.54.0",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu124"

[dependency-groups]
dev = [
    "hypothesis>=6.168.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
